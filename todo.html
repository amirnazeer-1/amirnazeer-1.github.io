<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; text-align: center; padding: 50px; }
        .container { background: white; padding: 20px; border-radius: 10px; width: 400px; margin: auto; }
        input { padding: 10px; width: 70%; }
        button { padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
        li { list-style: none; padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        .delete { float: right; color: red; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>My To-Do List ✅</h2>
        <input type="text" id="taskInput" placeholder="Naya kaam likhein...">
        <button onclick="addTask()">Add</button>
        <ul id="taskList"></ul>
    </div>

    <script>
        function addTask() {
            let task = document.getElementById("taskInput").value;
            if(task === "") return;
            
            let li = document.createElement("li");
            li.innerHTML = task + "<span class='delete' onclick='this.parentElement.remove()'>X</span>";
            document.getElementById("taskList").appendChild(li);
            document.getElementById("taskInput").value = "";
        }
    </script>
</body>
</html>
